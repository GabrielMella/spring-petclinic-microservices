spring:
  application:
    name: vets-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888/}
  cache:
    cache-names: vets
  profiles:
    active: production

chaos:
  monkey:
    security:
      enabled: true
      username: ${CHAOS_MONKEY_USER:chaos}
      password: ${CHAOS_MONKEY_PASSWORD:chaos}

---
spring:
  config:
    activate:
      on-profile: docker
    import: configserver:http://config-server:8888
