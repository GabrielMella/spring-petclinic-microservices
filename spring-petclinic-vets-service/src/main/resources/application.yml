spring:
  application:
    name: vets-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888/}
  cache:
    cache-names: vets
  profiles:
    active: production
  security:
    user:
      name: chaos-admin
      password: ${CHAOS_MONKEY_PASSWORD:changeme}

